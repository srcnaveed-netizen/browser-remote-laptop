<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Remote Laptop</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        /* Stretches screen to fill browser window exactly. Default cursor for native feel */
        #screen { width: 100vw; height: 100vh; object-fit: fill; cursor: default; }
    </style>
</head>
<body>
    <button id="kb-btn" style="position: absolute; top: 20px; right: 20px; z-index: 9999; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5); border-radius: 8px; font-size: 24px; padding: 10px; cursor: pointer; display: none;">⌨️</button>
    <input type="text" id="keyboard-trap" style="position: absolute; opacity: 0; pointer-events: none; top: 0;" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <img id="screen" alt="Waiting for home laptop to connect..."/>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const screen = document.getElementById('screen');
        const keyboardTrap = document.getElementById('keyboard-trap');
        const kbBtn = document.getElementById('kb-btn');

        // Show the keyboard button ONLY if on a touchscreen device
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            kbBtn.style.display = 'block';
        }

        // Display incoming video frames (Fast Binary Mode)
        socket.on('screen_frame', (data) => {
            const blob = new Blob([data], { type: 'image/jpeg' });
            const url = URL.createObjectURL(blob);
            screen.src = url;
            screen.onload = () => URL.revokeObjectURL(url); // Prevent memory leaks
        });

        // Trigger Mobile Keyboard ONLY when the keyboard button is tapped
        kbBtn.addEventListener('click', (e) => {
            e.preventDefault();
            keyboardTrap.focus();
        });

        // Capture Mobile Typing
        keyboardTrap.addEventListener('input', (e) => {
            if (e.data) socket.emit('key_press', { key: e.data.toLowerCase() });
            keyboardTrap.value = ""; // clear buffer
        });
        
        // Capture PC Typing & Backspace/Enter on Mobile
        window.addEventListener('keydown', (e) => {
            if (e.key !== "F11" && e.key !== "F12") e.preventDefault(); 
            socket.emit('key_press', { key: e.key.toLowerCase() });
        });

        // Capture Mouse Movement
        screen.addEventListener('mousemove', (e) => {
            const rect = screen.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            socket.emit('mouse_move', { x, y });
        });

        // Capture Mouse Clicks
        screen.addEventListener('mousedown', (e) => {
            const button = e.button === 0 ? 'left' : (e.button === 2 ? 'right' : 'middle');
            socket.emit('mouse_click', { button });
        });

        // Prevent right-click menu from opening in the browser
        window.addEventListener('contextmenu', e => e.preventDefault());

        // DOUBLE CLICK TO LARP (Enter Fullscreen)
        window.addEventListener('dblclick', () => {
            if (!document.fullscreenElement) {
                // Enter fullscreen
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                // Exit fullscreen if you double click again
                document.exitFullscreen();
            }
        });
    </script>
</body>
</html>
